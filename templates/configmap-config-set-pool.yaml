apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway-app.fullname" . }}-config-set-pool
  labels:
    {{- include "llm-gateway-app.labels" . | nindent 4 }}
data:
  configSetPool.json: |
    {
      "configSets": [
        {{- $configSets := .Values.serviceLlmGateway.configSetPool.configSets }}
        {{- range $i, $cs := $configSets }}
        {{- if $i }},{{ end }}
        {
          "externalId": {{ $cs.externalId | quote }},
          "name": {{ $cs.name | quote }},
          "provider": {{ $cs.provider | quote }},
          "modelType": {{ $cs.modelType | quote }},
          "modelGroup": {{ $cs.modelGroup | quote }},
          "credentialScheme": {{ $cs.credentialScheme | quote }},
          "credentialsEncrypted": {{ $cs.credentialsEncrypted | quote }},
          "providerConfig": {{ $cs.providerConfig | toJson }}
        }
        {{- end }}
      ],
      "pools": [
        {{- $pools := .Values.serviceLlmGateway.configSetPool.pools }}
        {{- range $i, $pool := $pools }}
        {{- if $i }},{{ end }}
        {
          "name": {{ $pool.name | quote }},
          "quotaAdapterKey": {{ $pool.quotaAdapterKey | quote }},
          "members": {{ $pool.members | toJson }}
        }
        {{- end }}
      ]
    }
