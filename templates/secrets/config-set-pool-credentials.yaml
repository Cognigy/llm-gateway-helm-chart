{{- if not .Values.serviceLlmGateway.configSetPool.credentials.existingSecret }}
{{- if not (lookup "v1" "Secret" $.Release.Namespace (printf "%s-config-set-pool-credentials" (include "llm-gateway-app.fullname" .))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway-app.fullname" . }}-config-set-pool-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "llm-gateway-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Each key is a filename referenced by credentialsEncrypted in the pool ConfigMap.
  # The value is the plaintext credential read from that file at CREDENTIALS_DIR.
  {{- range $key, $val := .Values.serviceLlmGateway.configSetPool.credentials.keys }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
